<section class="hero">
  <div class="hero__bg" aria-hidden="true">
    <div class="hero__blob hero__blob--gold"></div>
    <div class="hero__blob hero__blob--red"></div>
    <div class="hero__rays"></div>
  </div>

  <div class="container hero__inner">

    <div class="hero__content">
      <div class="hero__eyebrow">
        <span class="hero__eyebrow-bar"></span>
        <span>WELCOME TO APEX CORE</span>
      </div>

      <h1 class="hero__title" aria-label="Innovating Solutions. Empowering Growth.">
        <span class="hero__title-line"
              [class.is-typing]="line1Revealed > 0 || showCaret1"
              aria-hidden="true">
          <span *ngFor="let ch of line1Chars; let i = index"
                class="hero__title-char"
                [class.is-space]="ch === ' '"
                [class.is-visible]="i < line1Revealed">{{ ch === ' ' ? ' ' : ch }}</span>
          <span class="hero__title-caret"
                [class.is-visible]="showCaret1"
                aria-hidden="true"></span>
        </span>
        <span class="hero__title-line hero__title-line--accent"
              [class.is-typing]="line2Revealed > 0 || showCaret2"
              aria-hidden="true">
          <span *ngFor="let ch of line2Chars; let i = index"
                class="hero__title-char"
                [class.is-space]="ch === ' '"
                [class.is-visible]="i < line2Revealed">{{ ch === ' ' ? ' ' : ch }}</span>
          <span class="hero__title-caret"
                [class.is-visible]="showCaret2"
                aria-hidden="true"></span>
        </span>
      </h1>

      <p class="hero__lead">
        Apex Core delivers smart, scalable and innovative IT solutions that help
        businesses streamline operations, drive efficiency and achieve sustainable
        growth.
      </p>

      <div class="hero__actions">
        <a class="hero__cta hero__cta--gold" routerLink="/" fragment="services">
          OUR SERVICES
          <app-icon name="arrow-right" [size]="16"></app-icon>
        </a>
        <a class="hero__cta hero__cta--outline" routerLink="/" fragment="solutions">
          EXPLORE SOLUTIONS
          <app-icon name="arrow-right" [size]="16"></app-icon>
        </a>
      </div>

      <div class="hero__features">
        <div *ngFor="let f of features"
             class="hero__feature"
             [class]="'hero__feature--' + f.accent">
          <span class="hero__feature-glow" aria-hidden="true"></span>
          <span class="hero__feature-icon">
            <app-icon [name]="f.icon" [size]="16"></app-icon>
          </span>
          <div class="hero__feature-text">
            <div class="hero__feature-head">{{ f.head }}</div>
            <div class="hero__feature-tail">{{ f.tail }}</div>
          </div>
          <span class="hero__feature-bar" aria-hidden="true"></span>
        </div>
      </div>
    </div>

    <div class="hero__visual" (mouseenter)="pause()" (mouseleave)="resume()">
      <div class="hero__slider">
        <img *ngFor="let src of slides; let i = index"
             [src]="src"
             [class.is-active]="i === currentSlide"
             class="hero__slide"
             alt="" />
      </div>

      <div class="hero__dots" role="tablist" aria-label="Hero slides">
        <button *ngFor="let src of slides; let i = index"
                type="button"
                class="hero__dot"
                [class.is-active]="i === currentSlide"
                [attr.aria-label]="'Show slide ' + (i + 1)"
                [attr.aria-selected]="i === currentSlide"
                (click)="goTo(i)"></button>
      </div>
    </div>

  </div>

</section>
