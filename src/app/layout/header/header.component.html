<header class="site-header" [class.site-header--scrolled]="scrolled">
  <div class="container site-header__inner">
    <app-logo size="lg" [showTagline]="true"></app-logo>

    <nav class="nav" aria-label="Primary">
      <ul class="nav__list">
        <li *ngFor="let link of links">
          <a class="nav__link"
             [class.nav__link--active]="isActive(link)"
             [routerLink]="link.route"
             [fragment]="link.fragment">
            {{ link.label }}
            <svg *ngIf="link.hasCaret" class="nav__caret" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </li>
      </ul>
    </nav>

    <div class="site-header__cta">
      <a class="site-header__btn" routerLink="/contact">
        GET IN TOUCH
      </a>
    </div>

    <button class="hamburger"
            type="button"
            (click)="toggleMobile()"
            [attr.aria-expanded]="mobileOpen"
            aria-label="Toggle menu">
      <app-icon [name]="mobileOpen ? 'close' : 'menu'" [size]="24"></app-icon>
    </button>
  </div>

  <!-- Mobile drawer -->
  <div class="drawer" [class.drawer--open]="mobileOpen" (click)="closeMobile()">
    <div class="drawer__panel" (click)="$event.stopPropagation()">
      <ul class="drawer__list">
        <li *ngFor="let link of links">
          <a class="drawer__link"
             [class.drawer__link--active]="isActive(link)"
             [routerLink]="link.route"
             [fragment]="link.fragment"
             (click)="closeMobile()">
            {{ link.label }}
          </a>
        </li>
      </ul>
      <a class="site-header__btn drawer__cta" routerLink="/contact" (click)="closeMobile()">
        GET IN TOUCH
      </a>
    </div>
  </div>
</header>
